# pipeline.conf — hook -> ordered list of enabled modules.
#
# One line per hook. Modules run left to right. Reorder to reorder the pipeline;
# delete a name to drop a check; add a name (plus its modules/<name>/ dir) to add
# one. A module can also be toggled off via ENABLED=0 in its module.conf without
# editing this file. Blank/# lines are ignored; trailing # comments are stripped.

pre_request:    filter-secret-redact
post_response:
pre_tool:       seccheck-path-guard seccheck-bash-allowlist review-llm-tool-gate
post_tool:      sanitize-control-strip filter-secret-redact
on_exit:
